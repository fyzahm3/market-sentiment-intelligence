[project]
name = "signal-audit"
version = "0.1.0"
description = "Tests whether a news or social-media trading signal has a real edge, and keeps a tamper-evident forward record."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
sigaudit = "signal_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "yfinance.*", "exchange_calendars.*"]
ignore_missing_imports = true
